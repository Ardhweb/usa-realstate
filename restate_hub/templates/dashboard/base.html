<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock title %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.lineicons.com/5.0/lineicons.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">  
<style>
    #body{
        font-family: "Kanit", serif;
        font-weight: 500;
        font-style: normal;
        background-color:#f1f5f9!important;
    }
    
    .dropdown-toggle{
        pointer:cursor;
    }
    /* Remove default arrow */
    .dropdown-toggle::after {
        display: none !important;
    }
    .dropdown-menu{
        width:max-content!important;
        border:none;
        font-family: "Kanit", serif;
    }
    .dropdown-menu li a {
        color:rgba(26, 33, 66, 0.5);
    }
    .dropdown-item:hover{
        background:#f3f3f3;
        font-weight:500;
        color:#1a2142;
    }
    .dropdown-item li a i:hover{
      
        font-weight:bold;
        color:#1a2142;
      
    }
    .sidebar-wrapper{
        width:250px!important;
        background:#fff!important;
        font-family: "Kanit", serif;
        overflow-y:scroll!important;
    }
    .winder-menu{

    }
    .winder-item{
        color:rgba(26, 33, 66, 0.5);
    }
    .winder-item:hover{
        background:#f3f3f3;
        font-weight:400;
        color:#1a2142;
        width:100%;

    }

    .active{
        background:#f3f3f3;
        font-weight:400;
        color:#1a2142;
        width:100%;

    }

    @media (max-width: 768px) {
        .extend-group-item {
            
            display:none!important /* Ensure it stacks properly */
          
        }
    }
    
    .count-card{
        font-family: "Kanit", serif;
    }

    .count-card i{
        color:#986ac3!important;

    }
    .count-card .icon{
        background: rgba(155, 81, 224, 0.1);
    }

    .bg-pruple{
        background-color:#986ac3;
    }
    
</style>
</head>
  <body style="background-color:#f1f5f9!important;">
    <nav class="navbar navbar-expand-lg navbar-light bg-light stickey-top shadow">
        <div class="container-fluid">
            <!-- Left Section -->
            <button data-bs-toggle="offcanvas" data-bs-target="#offcanvasSidebar" class="btn me-2 menu-button btn-primary">
                <i class="lni lni-menu-hamburger-1 fs-3"></i>
            </button>
            <form class="d-flex ">
                <div class="position-relative">
                    <input type="text" class="form-control pe-5 rounded-pill border-none" placeholder="Search" aria-label="Search">
                    <button type="submit" class="position-absolute end-0 top-50 translate-middle-y border-0 bg-transparent px-3">
                        <i class="lni lni-search-2"></i>
                    </button>
                </div>
                
            </form>
    
            <!-- Right Section -->
            <div class="ms-auto d-flex align-items-center">
                <!-- Notification Dropdown -->
                <div class="extend-group-item dropdown me-3">
                    <a class="text-reset dropdown-toggle" href="#" role="button" id="notificationDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="lni lni-bell-1 fs-3"></i>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end" aria-labelledby="notificationDropdown">
                        <li class="dropdown-item">No new notifications</li>
                    </ul>
                </div>
    
                <!-- Profile Dropdown -->
                <div class="btn-group">
                    <a class="dropdown-toggle" data-bs-toggle="dropdown">
                        <img src="https://i.pravatar.cc/50" class="rounded-circle border border-2 mx-2" alt="Profile Image" width="40" height="40">
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end px-3 shadow-sm">
                        <li class="dropdown-item d-flex align-items-center">
                            <a href="#" class="text-reset d-flex text-decoration-none">
                                <img src="https://i.pravatar.cc/50" class="rounded-circle border border-2 mx-2" alt="Profile Image" width="30" height="30">
                                <span>Admin RoeJoe</span>
                            </a>
                        </li>
                        <small class="text-muted text-truncate-custom ms-4 overflow-hidden">admin@gmail.com</small>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item py-2  rounded d-flex align-items-center" href="#"><i class="fs-5 lni lni-bell-1 me-2"></i> <span>Notification</span></a></li>
                        <li><a class="dropdown-item   py-2  rounded  d-flex align-items-center" href="#"><i class="fs-5 lni lni-user-4 me-2"></i> <span>View Profile</span></a></li>
                        <li><a class="dropdown-item py-2  rounded  d-flex align-items-center" href="#"><i class="fs-5 lni lni-gear-1 me-2"></i> <span>Settings</span></a></li>
                        <li><hr class="dropdown-divider"></li>
                        <li><a class="dropdown-item  py-2  rounded  d-flex align-items-center" href="#"><i class="fs-5 lni lni-exit me-2"></i> <span>Sign Out</span></a></li>
                    </ul>
                </div>
            </div>
        </div>
    </nav>
    



<!-- Offcanvas Sidebar -->
{% include "dashboard/sidebar.html" %}
    
     
    <main>
        {% block content %}{% endblock content %}
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    {% block scripts %}{% endblock scripts %}  
</body>
</html>
