<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}{% endblock title %}</title>

     <!-- DataTables CSS -->
     <link rel="stylesheet" href="https://cdn.datatables.net/1.13.6/css/jquery.dataTables.min.css">
    
     <!-- jQuery and DataTables JS -->
     <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
     <script src="https://cdn.datatables.net/1.13.6/js/jquery.dataTables.min.js"></script>

     
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.lineicons.com/5.0/lineicons.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">  
<style>
    #body{
        font-family: "Kanit", serif;
        font-weight: 500;
        font-style: normal;
        background-color:#f1f5f9!important;
    }
    
    .dropdown-toggle{
        pointer:cursor;
    }
    /* Remove default arrow */
    .dropdown-toggle::after {
        display: none !important;
    }
    .dropdown-menu{
        width:max-content!important;
        border:none;
        font-family: "Kanit", serif;
    }
    .dropdown-menu li a {
        color:rgba(26, 33, 66, 0.5);
    }
    .dropdown-item:hover{
        background:#f3f3f3;
        font-weight:500;
        color:#1a2142;
    }
    .dropdown-item li a i:hover{
      
        font-weight:bold;
        color:#1a2142;
      
    }
    .sidebar-wrapper{
        width:250px!important;
        background:#fff!important;
        font-family: "Kanit", serif;
        overflow-y:scroll!important;
    }
    .winder-menu{

    }
    .winder-item{
        color:rgba(26, 33, 66, 0.5);
    }
    .winder-item:hover{
        background:#f3f3f3;
        font-weight:400;
        color:#1a2142;
        width:100%;

    }

    .active{
        background:#f3f3f3;
        font-weight:400;
        color:#1a2142;
        width:100%;

    }

    @media (max-width: 768px) {
        .extend-group-item {
            
            display:none!important /* Ensure it stacks properly */
          
        }
    }
    
    .count-card{
        font-family: "Kanit", serif;
    }

   
    .count-card .icon{
        background-color:rgba(155, 81, 224, 0.1);
        padding-left:12px;
        padding-right:12px;
    }
    .count-card .icon-2{
        background-color: rgba(33, 150, 83, 0.1);
        padding-left:12px;
        padding-right:12px;
    }

    .count-card .icon-3{
        background-color: rgba(54, 92, 245, 0.1);
        padding-left:12px;
        padding-right:12px;
    }

    .i-primary{
        color:#986ac3!important;
       
    }

    .i-secondary{
        color:#219653;
    }

    .i-tertiary{
        color:#365CF5!important;
    }




   
    /*
    text*/
    .text-primary{
        color:red;
    }
    .text-secondary{
        color:red;
    }

    h1, h2, h3, h4, h5, h6, .h1, .h2, .h3, .h4, .h5, .h6{
        color:#1A2142!important;
    }
    ::-webkit-scrollbar {
        width: 8px;
        /* Scrollbar width */
        height: 6px;
        /* Adjust height (for horizontal scrollbar) */

    }

    /* Track (the background) */
    ::-webkit-scrollbar-track {
        background: #f1f1f1;
        border-radius: 10px;
        height: 6px;
        /* Adjust height (for horizontal scrollbar) */

    }

    /* Handle (the moving part) */
    ::-webkit-scrollbar-thumb {
        background: linear-gradient(45deg, #4a90e2, #9013fe);
        border-radius: 10px;
    }

    /* Handle on hover */
    ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(45deg, #3b74c5, #7510d6);
    }

</style>
</head>
  <body style="background-color:#f1f5f9!important;">
  {% include "dashboard/nav.html" %}
    



<!-- Offcanvas Sidebar -->
{% include "dashboard/sidebar.html" %}
    
     
    <main>
        {% block content %}{% endblock content %}
    </main>

    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    {% block scripts %}{% endblock scripts %}  
</body>
</html>
