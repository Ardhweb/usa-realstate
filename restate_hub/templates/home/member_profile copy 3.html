{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate App - Member Profile</title>
     <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <style>
        /* CSS that cannot be easily inlined, mainly for animations, specific layout */
        body {
            background-color: #f2f2f2;
            color: #1a3a63;
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
        }
       @keyframes slideInFromLeft {
            0% {
                transform: translateX(-100px);
                opacity: 0;
            }
            100% {
                transform: translateX(0);
                opacity: 1;
            }
        }
        .navbar:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .navbar-brand:hover {
             color: #0d2b50;
             transform: scale(1.05);
        }

        .navbar a.nav-link:hover {
            color: #0d2b50;
            transform: scale(1.1);
        }

        .navbar .btn-outline-primary:hover {
            background-color: #1a3a63;
            color: white;
            transform: scale(1.05);
        }

        .navbar .btn-primary:hover {
            background-color: #0d2b50;
            color: white;
             transform: scale(1.05);
        }
        @media (max-width: 991px) {
            .navbar-nav {
                text-align: center;
                margin-top: 15px;
            }

            .navbar .btn {
                width: 100%;
                margin-top: 10px;
            }
        }
        .member-profile-main {
           display: flex;
           justify-content: center;
           align-items: center;
           padding-top: 50px;
           padding-bottom: 50px;
        }
    </style>
</head>
<body>
    <header>
       <nav class="navbar navbar-expand-lg navbar-light" style="padding-top: 12px !important; padding-bottom: 12px !important; background-color: #e3f2fd; box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1); transition: all 0.3s ease;">
            <div class="container">
                <a class="navbar-brand" href="/" style="color: #1a3a63; font-weight: bold; font-size: 1.6rem; transition: color 0.3s ease, transform 0.3s ease;">Homelinker</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="/" style="color: #1a3a63; font-size: 1.1rem; transition: color 0.3s ease, transform 0.3s ease;">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="/signup/" style="color: #1a3a63; font-size: 1.1rem; transition: color 0.3s ease, transform 0.3s ease;">Sign Up</a></li>
                        <li class="nav-item"><a class="nav-link" href="/member/" style="color: #1a3a63; font-size: 1.1rem; transition: color 0.3s ease, transform 0.3s ease;">Member Profile</a></li>
                        <li class="nav-item"><a class="nav-link" href="/property/" style="color: #1a3a63; font-size: 1.1rem; transition: color 0.3s ease, transform 0.3s ease;">Properties</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main class="member-profile-main">
        <div class="container">
           <h1 class="member-profile-title" style="color: #1478a7; font-weight: 700; text-align: center; margin-bottom: 30px; animation: slideInFromLeft 0.8s ease-out;">Member Profile</h1>
            <div class="member-profile-form">
                 <div class="row">
                     <div class="col-md-6">
                       <div class="form-group" style="margin-bottom: 1.5rem;">
                            <label for="first_name" style="font-weight: 500; color: #343a40;">First Name:</label>
                           <input type="text" id="first_name" name="first_name" class="form-control"  readonly value="{{ member.first_name }}" style="border: 1px solid #ced4da; border-radius: 8px; padding: 12px 16px; font-size: 1rem;">
                       </div>
                       <div class="form-group" style="margin-bottom: 1.5rem;">
                        <label for="street_number" style="font-weight: 500; color: #343a40;">Street Number:</label>
                        <input type="text" id="street_number" name="street_number" class="form-control" readonly value="{{ member.street_number }}" style="border: 1px solid #ced4da; border-radius: 8px; padding: 12px 16px; font-size: 1rem;">
                       </div>
                       <div class="form-group" style="margin-bottom: 1.5rem;">
                        <label for="phone" style="font-weight: 500; color: #343a40;">Phone:</label>
                        <input type="text" id="phone" name="phone" class="form-control"  readonly value="{{ member.phone }}" style="border: 1px solid #ced4da; border-radius: 8px; padding: 12px 16px; font-size: 1rem;">
                    </div>
                    <div class="form-group" style="margin-bottom: 1.5rem;">
                        <label for="city" style="font-weight: 500; color: #343a40;">City:</label>
                        <input type="text" id="city" name="city" class="form-control" readonly value="{{ member.city }}" style="border: 1px solid #ced4da; border-radius: 8px; padding: 12px 16px; font-size: 1rem;">
                   </div>
                     </div>
                     <div class="col-md-6">
                       <div class="form-group" style="margin-bottom: 1.5rem;">
                           <label for="last_name" style="font-weight: 500; color: #343a40;">Last Name:</label>
                           <input type="text" id="last_name" name="last_name" class="form-control" readonly value="{{ member.last_name }}" style="border: 1px solid #ced4da; border-radius: 8px; padding: 12px 16px; font-size: 1rem;">
                       </div>
                       <div class="form-group" style="margin-bottom: 1.5rem;">
                        <label for="street_address" style="font-weight: 500; color: #343a40;">Street Address:</label>
                       <input type="text" id="street_address" name="street_address" class="form-control"  readonly value="{{ member.street_address }}" style="border: 1px solid #ced4da; border-radius: 8px; padding: 12px 16px; font-size: 1rem;">
                   </div>

                      <div class="form-group" style="margin-bottom: 1.5rem;">
                         <label for="email" style="font-weight: 500; color: #343a40;">Email:</label>
                         <input type="email" id="email" name="email" class="form-control" readonly value="{{ member.email }}" style="border: 1px solid #ced4da; border-radius: 8px; padding: 12px 16px; font-size: 1rem;">
                       </div>
                       <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label for="membership_type" style="font-weight: 500; color: #343a40;">Membership Type:</label>
                    <input type="text" id="membership_type" name="membership_type" class="form-control" readonly value="{{ member.membership_type }}" style="border: 1px solid #ced4da; border-radius: 8px; padding: 12px 16px; font-size: 1rem;">
              </div>


                     </div>
                 </div>
               <div class="row mt-3">
                  <div class="col-md-6">
                     <div class="form-group" style="margin-bottom: 1.5rem;">
                        <label for="state" style="font-weight: 500; color: #343a40;">State:</label>
                         <input type="text" id="state" name="state" class="form-control" readonly value="{{ member.state }}" style="border: 1px solid #ced4da; border-radius: 8px; padding: 12px 16px; font-size: 1rem;">
                      </div>
                  </div>
                  <div class="col-md-6">
                     <div class="form-group" style="margin-bottom: 1.5rem;">
                        <label for="zip_code" style="font-weight: 500; color: #343a40;">Zip Code:</label>
                         <input type="text" id="zip_code" name="zip_code" class="form-control"  readonly value="{{ member.zip_code }}" style="border: 1px solid #ced4da; border-radius: 8px; padding: 12px 16px; font-size: 1rem;">
                     </div>
                 </div>
               </div>
                <div class="row mt-3">
                    <div class="col-md-6">
                        <div class="form-group" style="margin-bottom: 1.5rem;">
                           <label for="has_agent" style="font-weight: 500; color: #343a40;">Do you have an agent?</label>
                             <select id="has_agent" name="has_agent" class="form-select" style="border: 1px solid #ced4da; border-radius: 8px; padding: 12px 16px; font-size: 1rem;">
                                  <option value="no">No</option>
                                  <option value="yes">Yes</option>
                             </select>
                         </div>
                    </div>
                    <div class="col-md-6">
                      <div class="form-group" style="margin-bottom: 1.5rem;">
                           <label for="business_name" style="font-weight: 500; color: #343a40;">Business Name:</label>
                          <input type="text" id="business_name" name="business_name" class="form-control" readonly value="{{ member.business_name }}" style="border: 1px solid #ced4da; border-radius: 8px; padding: 12px 16px; font-size: 1rem;">
                      </div>
                    </div>
                </div>
                  <div id="agent-section" style="display: none;">
                      <div class="row mt-3">
                        <div class="col-md-6">
                             <div class="form-group" style="margin-bottom: 1.5rem;">
                              <label for="agent_first_name" style="font-weight: 500; color: #343a40;">Agent First Name:</label>
                              <input type="text" id="agent_first_name" name="agent_first_name" class="form-control" placeholder="Enter Agent First Name" style="border: 1px solid #ced4da; border-radius: 8px; padding: 12px 16px; font-size: 1rem;">
                          </div>
                       </div>
                         <div class="col-md-6">
                             <div class="form-group" style="margin-bottom: 1.5rem;">
                                  <label for="agent_last_name" style="font-weight: 500; color: #343a40;">Agent Last Name:</label>
                                 <input type="text" id="agent_last_name" name="agent_last_name" class="form-control"  placeholder="Enter Agent Last Name" style="border: 1px solid #ced4da; border-radius: 8px; padding: 12px 16px; font-size: 1rem;">
                            </div>
                          </div>
                       </div>
                      <div class="row mt-3">
                        <div class="col-md-6">
                             <div class="form-group" style="margin-bottom: 1.5rem;">
                              <label for="agent_phone" style="font-weight: 500; color: #343a40;">Agent Phone #:</label>
                              <input type="text" id="agent_phone" name="agent_phone" class="form-control" placeholder="Enter Agent Phone #" style="border: 1px solid #ced4da; border-radius: 8px; padding: 12px 16px; font-size: 1rem;">
                         </div>
                        </div>
                        <div class="col-md-6">
                           <div class="form-group" style="margin-bottom: 1.5rem;">
                             <label for="agent_email" style="font-weight: 500; color: #343a40;">Agent Email:</label>
                            <input type="email" id="agent_email" name="agent_email" class="form-control"  placeholder="Enter Agent Email" style="border: 1px solid #ced4da; border-radius: 8px; padding: 12px 16px; font-size: 1rem;">
                           </div>
                         </div>
                     </div>
                   </div>

                <div class="row mt-3">
                    <div class="col-md-4">
                         <div class="form-group" style="margin-bottom: 1.5rem;">
                             <label for="one_time_fee" style="font-weight: 500; color: #343a40;">One-Time Setup Fee:</label>
                            <input type="text" id="one_time_fee" name="one_time_fee" class="form-control"  readonly value="{{ member.one_time_fee }}" style="border: 1px solid #ced4da; border-radius: 8px; padding: 12px 16px; font-size: 1rem;">
                          </div>
                       </div>
                      <div class="col-md-4">
                       <div class="form-group" style="margin-bottom: 1.5rem;">
                          <label for="monthly_fee" style="font-weight: 500; color: #343a40;">Monthly Subscription Fee:</label>
                           <input type="text" id="monthly_fee" name="monthly_fee" class="form-control" readonly value="{{ member.monthly_fee }}" style="border: 1px solid #ced4da; border-radius: 8px; padding: 12px 16px; font-size: 1rem;">
                         </div>
                       </div>
                     <div class="col-md-4">
                           <div class="form-group" style="margin-bottom: 1.5rem;">
                              <label for="total" style="font-weight: 500; color: #343a40;">Total:</label>
                              <input type="text" id="total" name="total" class="form-control"  readonly value="{{ member.total_fee }}" style="border: 1px solid #ced4da; border-radius: 8px; padding: 12px 16px; font-size: 1rem;">
                         </div>
                    </div>
               </div>
               <div class="row mt-4">
                 <div class="col-md-12">
                    <div class="form-group" style="margin-bottom: 1.5rem;">
                     <label for="send_question" style="font-weight: 500; color: #343a40;">Send a Question to Admin(Optional):</label>
                      <textarea id="send_question" name="send_question" class="form-control" rows="3"  placeholder="Type your message here..." style="border: 1px solid #ced4da; border-radius: 8px; padding: 12px 16px; font-size: 1rem;"></textarea>
                    </div>
                 </div>
                </div>
                 <div class="row mt-3 mb-4">
                     <div class="col-md-12 text-center">
                        <button type="submit" class="btn btn-success" style="background-color: #1478a7 !important; border-color: #1478a7 !important; color: #fff !important; border-radius: 10px !important; padding: 14px 26px !important; font-weight: 600 !important; transition: all 0.3s ease !important; display: flex; align-items: center; justify-content: center; gap: 5px;">Submit <i class="fas fa-paper-plane" style="margin-left: 5px; font-size: 1.1rem;"></i></button>
                     </div>
                  </div>
            </div>
        </div>
    </main>
     <footer class="text-center mt-5 py-3" style="background-color: #f8f9fa; margin-top: 10px; padding: 10px; text-align: center;">
        <p>© 2024 Real Estate App</p>
     </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script>
        document.getElementById('has_agent').addEventListener('change', function() {
            const agentSection = document.getElementById('agent-section');
            agentSection.style.display = this.value === 'yes' ? 'block' : 'none';
        });
    </script>
</body>
</html>
