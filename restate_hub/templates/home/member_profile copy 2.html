{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real Estate App - Member Profile</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" integrity="sha512-9usAa10IRO0HhonpyAIVpjrylPvoDwiPUiKdWk5t3PyolY1cOd4DSE0Ga+ri4AuTroPR5aQvXU9xC6qOPnzFeg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<style>
    /* General Styling */
body {
    background-color: #f2f2f2;
    color: #1a3a63;
    font-family: 'Arial', sans-serif;
    line-height: 1.6;
}

/* Navbar background and padding */
.navbar {
    padding-top: 12px !important;
    padding-bottom: 12px !important;
    background-color: #e3f2fd;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    transition: all 0.3s ease;
}

.navbar:hover {
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
}

/* Navbar brand */
.navbar-brand {
    color: #1a3a63;
    font-weight: bold;
    font-size: 1.6rem;
    transition: color 0.3s ease, transform 0.3s ease;
}

.navbar-brand:hover {
    color: #0d2b50;
    transform: scale(1.05);
}

/* Navbar links */
.navbar a.nav-link {
    color: #1a3a63;
    font-size: 1.1rem;
    transition: color 0.3s ease, transform 0.3s ease;
}

.navbar a.nav-link:hover {
    color: #0d2b50;
    transform: scale(1.1);
}

/* Button Styles */
.navbar .btn {
    font-size: 1rem;
    padding: 10px 24px;
    border-radius: 25px;
    transition: background-color 0.3s ease, color 0.3s ease, transform 0.3s ease;
}

/* Button hover effects */
.navbar .btn-outline-primary:hover {
    background-color: #1a3a63;
    color: white;
    transform: scale(1.05);
}

.navbar .btn-primary:hover {
    background-color: #0d2b50;
    color: white;
    transform: scale(1.05);
}

/* Responsive Navbar */
@media (max-width: 991px) {
    .navbar-nav {
        text-align: center;
        margin-top: 15px;
    }

    .navbar .btn {
        width: 100%;
        margin-top: 10px;
    }
}
/* Member Profile specific styles */
.member-profile-main {
   display: flex;
   justify-content: center;
   align-items: center;
   padding-top: 50px;
   padding-bottom: 50px;
}


.member-profile-title {
    color: #1478a7;
    font-weight: 700;
    text-align: center;
    margin-bottom: 30px;
    animation: slideInFromLeft 0.8s ease-out;
}

/*Animation for title*/
@keyframes slideInFromLeft {
    0% {
      transform: translateX(-100px);
      opacity: 0;
    }
    100% {
      transform: translateX(0);
      opacity: 1;
    }
  }
.member-profile-form .form-group {
  margin-bottom: 1.5rem;
}

.member-profile-form label {
    font-weight: 500;
    color: #343a40;
}
.member-profile-form .form-control,
.member-profile-form .form-select {
    border: 1px solid #ced4da;
    border-radius: 8px;
    padding: 12px 16px;
    font-size: 1rem;
}

.member-profile-form .form-control:focus,
.member-profile-form .form-select:focus {
    outline: none;
    box-shadow: 0 0 0 0.2rem rgba(20, 120, 167, 0.25);
    border-color: #1478a7;
}

.member-profile-form small {
    font-size: 0.9rem;
    color: #6c757d;
    margin-top: 0.2rem;
}
.btn-success {
    background-color: #1478a7 !important;
    border-color: #1478a7 !important;
    color: #fff !important;
    border-radius: 10px !important;
    padding: 14px 26px !important;
    font-weight: 600 !important;
    transition: all 0.3s ease !important;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;
}
.btn-success i {
    margin-left: 5px;
    font-size: 1.1rem;
}
.btn-success:hover {
    background-color: #0d527a !important;
    border-color: #0d527a !important;
    color: white !important;
    transform: scale(1.03);
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
}
.row {
  margin-bottom: 20px;
}
.login-link {
    color: #1478a7;
    text-decoration: underline;
    transition: color 0.3s ease;
}
.login-link:hover {
     color: #0d527a;
}
</style>
<body>
    <header>
        <nav class="navbar navbar-expand-lg navbar-light">
            <div class="container">
                <a class="navbar-brand" href="/">Homelinker</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="/">Home</a></li>
                        <li class="nav-item"><a class="nav-link" href="/signup/">Sign Up</a></li>
                         <li class="nav-item"><a class="nav-link" href="/memberprofile/">Member Profile</a></li>
                        <li class="nav-item"><a class="nav-link" href="/properties/">Properties</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main class="member-profile-main">
        <div class="container">
            <h1 class="member-profile-title">Member Profile</h1>
            <div class="member-profile-form">
                 <div class="row">
                     <div class="col-md-6">
                       <div class="form-group">
                            <label for="first_name">First Name:</label>
                           <input type="text" id="first_name" name="first_name" class="form-control"  readonly value="{{ member.first_name }}">
                       </div>
                       <div class="form-group">
                        <label for="street_number">Street Number:</label>
                        <input type="text" id="street_number" name="street_number" class="form-control" readonly value="{{ member.street_number }}"> 
                    </div>
                    <div class="form-group">
                        <label for="phone">Phone:</label>
                        <input type="text" id="phone" name="phone" class="form-control"  readonly value="{{ member.phone }}">
                    </div>
                       <div class="form-group">
                             <label for="membership_type">Membership Type:</label>
                             <select id="membership_type" name="membership_type" class="form-select" required>
                                <option value="">Select Member Type</option>
                                {% for member_type in member_types %}
                                   <option value="{{ member_type.id }}" {% if member.membership_type == member_type.id %} selected {% endif %}>{{ member_type.name }}</option>
                                {% endfor %}
                            </select>
                       </div>
                         <div class="form-group" >
                                <label for="lease_back">Leaseback:</label>
                                <select id="lease_back" name="lease_back" class="form-select" >
                                    <option value="none"  {% if member.lease_back == 'none' %} selected {% endif %}>None</option>
                                    <option value="yes"  {% if member.lease_back == 'yes' %} selected {% endif %}>Yes</option>
                                    <option value="no"  {% if member.lease_back == 'no' %} selected {% endif %}>No</option>
                                </select>
                            </div>
                     </div>
                     <div class="col-md-6">
                       <div class="form-group">
                           <label for="last_name">Last Name:</label>
                           <input type="text" id="last_name" name="last_name" class="form-control" readonly value="{{ member.last_name }}">
                       </div>
                       <div class="form-group">
                        <label for="street_address">Street Address:</label>
                       <input type="text" id="street_address" name="street_address" class="form-control"  readonly value="{{ member.street_address }}">
                       </div>
                      <div class="form-group">
                         <label for="email">Email:</label>
                         <input type="email" id="email" name="email" class="form-control" readonly value="{{ member.email }}">
                       </div>
                       <div class="form-group">
                        <label for="city">City:</label>
                        <input type="text" id="city" name="city" class="form-control" readonly value="{{ member.city }}">
                   </div>
                   <div class="form-group">
                          <label for="reason_selling">Reason For Selling</label>
                          <select id="reason_selling" name="reason_selling" class="form-select">
                               <option value="">Select Reason For Selling</option>
                                {% for reason in reasons %}
                                   <option value="{{ reason.id }}"  {% if member.reason_selling == reason.id %} selected {% endif %}>{{ reason.name }}</option>
                                {% endfor %}
                           </select>
                    </div>
                    <div class="form-group">
                        <label for="leaseback_months">Lease Back Months</label>
                        <input 
                            type="text" 
                            id="leaseback_months" 
                            name="leaseback_months" 
                            class="form-control" 
                            value="{{ member.leaseback_months }}" 
                            min="1" 
                            oninput="this.value = this.value.replace(/[^0-9]/g, '').replace(/^0+/, '');"
                            required
                        >
                    </div>
                    
                     </div>
                 </div>
               <div class="row mt-3">
                  <div class="col-md-6">
                     <div class="form-group">
                        <label for="state">State:</label>
                         <input type="text" id="state" name="state" class="form-control" readonly value="{{ member.state }}">
                      </div>
                  </div>
                  <div class="col-md-6">
                     <div class="form-group">
                        <label for="zip_code">Zip Code:</label>
                         <input type="text" id="zip_code" name="zip_code" class="form-control"  readonly value="{{ member.zip_code }}">
                     </div>
                 </div>
               </div>

                 <div class="row mt-3">
                   <div class="col-md-6">
                       <div class="form-group">
                          <label for="has_agent">Do you have an agent?</label>
                            <select id="has_agent" name="has_agent" class="form-select">
                                 <option value="no"  {% if member.has_agent == 'no' %} selected {% endif %}>No</option>
                                 <option value="yes"  {% if member.has_agent == 'yes' %} selected {% endif %}>Yes</option>
                            </select>
                        </div>
                    </div>
                      <div class="col-md-6">
                           <div class="form-group">
                              <label for="business_name">Business Name:</label>
                             <input type="text" id="business_name" name="business_name" class="form-control" readonly value="{{ member.business_name }}">
                          </div>
                      </div>
                </div>
                  <div id="agent-section" style="display: none;">
                      <div class="row mt-3">
                        <div class="col-md-6">
                             <div class="form-group">
                              <label for="agent_first_name">Agent First Name:</label>
                              <input type="text" id="agent_first_name" name="agent_first_name" class="form-control" placeholder="Enter Agent First Name" value="{{ member.agent_first_name }}">
                          </div>
                       </div>
                         <div class="col-md-6">
                             <div class="form-group">
                                  <label for="agent_last_name">Agent Last Name:</label>
                                 <input type="text" id="agent_last_name" name="agent_last_name" class="form-control"  placeholder="Enter Agent Last Name"  value="{{ member.agent_last_name }}">
                            </div>
                          </div>
                       </div>
                      <div class="row mt-3">
                        <div class="col-md-6">
                             <div class="form-group">
                              <label for="agent_phone">Agent Phone #:</label>
                              <input type="text" id="agent_phone" name="agent_phone" class="form-control" placeholder="Enter Agent Phone #" value="{{ member.agent_phone }}">
                         </div>
                        </div>
                        <div class="col-md-6">
                           <div class="form-group">
                             <label for="agent_email">Agent Email:</label>
                            <input type="email" id="agent_email" name="agent_email" class="form-control"  placeholder="Enter Agent Email"  value="{{ member.agent_email }}">
                           </div>
                         </div>
                     </div>
                 <div class="row mt-3">
                   <div class="col-md-4">
                         <div class="form-group">
                             <label for="one_time_fee">One-Time Setup Fee:</label>
                            <input type="text" id="one_time_fee" name="one_time_fee" class="form-control"  readonly value="{{ member.one_time_fee }}">
                          </div>
                       </div>
                      <div class="col-md-4">
                       <div class="form-group">
                          <label for="monthly_fee">Monthly Subscription Fee:</label>
                           <input type="text" id="monthly_fee" name="monthly_fee" class="form-control" readonly value="{{ member.monthly_fee }}">
                         </div>
                       </div>
                     <div class="col-md-4">
                           <div class="form-group">
                              <label for="total">Total:</label>
                              <input type="text" id="total" name="total" class="form-control"  readonly value="{{ member.total_fee }}">
                         </div>
                    </div>
               </div>
              <div class="row mt-4 mb-4">
                  <div class="col-md-12 text-center">
                         <a href="/properties" class="btn btn-primary">Click to Enter Property Info</a>
                   </div>
              </div>
               <div class="row mt-4">
                 <div class="col-md-12">
                    <div class="form-group">
                     <label for="send_question">Send a Question to Admin:</label>
                      <textarea id="send_question" name="send_question" class="form-control" rows="3"  placeholder="Type your message here..."></textarea>
                    </div>
                 </div>
                </div>
                 <div class="row mt-3 mb-4">
                     <div class="col-md-12 text-center">
                        <button type="submit" class="btn btn-success">Send <i class="fas fa-paper-plane"></i></button>
                     </div>
                  </div>
            </div>
        </div>
    </main>
     <footer class="text-center mt-5 py-3">
        <p>© 2024 Real Estate App</p>
     </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
          <script>
        document.getElementById('has_agent').addEventListener('change', function() {
            const agentSection = document.getElementById('agent-section');
            agentSection.style.display = this.value === 'yes' ? 'block' : 'none';
        });
    </script>
</body>
</html>
