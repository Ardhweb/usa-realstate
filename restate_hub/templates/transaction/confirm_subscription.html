{% extends "base.html" %}

{% block content %}
<div class="container mt-5">
    <p>Final Step</p>
    <div class="card shadow-lg p-4">
        <h2 class="text-center mb-4">Confirm Your Subscription</h2>
        <p class="text-center">Please review your subscription details before confirming.</p>

        <form method="POST">
            {% csrf_token %}
            
            <div class="mb-3">
                <label class="form-label"><strong>Plan:</strong></label>
                <input type="text" class="form-control" value="{{ request.user.member_type }}" disabled>
            </div>

            <div class="mb-3">
                <label class="form-label"><strong>Activation Date:</strong></label>
                <input type="text" class="form-control" value="2025-04-01" disabled>
            </div>

            <button type="submit" class="btn btn-primary w-100">Confirm Subscription</button>
        </form>
    </div>
</div>

{% endblock content %}
