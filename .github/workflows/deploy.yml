name: Deploy to Render on Main Merge or Push

on:
  push:
    branches:
      - main
  pull_request:
    types: [closed]
    branches:
      - main 

jobs:
  deploy:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.merged == true && github.event.pull_request.base.ref == 'main' && github.event.pull_request.head.ref == 'ardhweb')
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          echo "Triggering Render Deploy Hook..."
          curl -X POST \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            "$RENDER_DEPLOY_HOOK"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}