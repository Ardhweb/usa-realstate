name: Deploy to Render on merge from ardhweb

on:
  push:
    branches:
      - main  # When code is pushed to main (including merges)

jobs:
  deploy:
    if: |
      contains(github.event.head_commit.message, 'ardhweb')  # Check if commit message contains ardhweb (optional)

    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl -X POST \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            "$RENDER_DEPLOY_HOOK"
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
